# YOLO26-RipeLoc Lite Model Configuration
# Based on YOLO26n (nano) with LFPN + RAAM + CDH
# Params: 2.38M | GFLOPs: 6.4
nc: 2
names: [unripe, ripe]
width_multiple: 0.25
depth_multiple: 0.33

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C3k2, [128, True, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C3k2, [256, True, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C3k2, [512, True, 0.25]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C3k2, [1024, True, 0.25]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, C2PSA, [1024]]

neck:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, DW_C3k2, [512, False, 0.25]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, DW_C3k2, [256, False, 0.25]]
  - [-1, 1, RAAM, [256, 16]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 1, DW_C3k2, [512, False, 0.25]]
  - [-1, 1, RAAM, [512, 16]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, DW_C3k2, [1024, True, 0.25]]

head:
  - [[17, 21, 24], 1, CDH, [2]]
